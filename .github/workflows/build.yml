name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Signed with your own upload key (from the repo's secrets), so every new
      # APK installs over the last one. Without the key it falls back to a
      # throwaway debug key, which needs an uninstall between versions.
      - name: Build APK and Play bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No upload key in secrets - building a debug-signed APK only."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk SugarLock.apk
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk SugarLock.apk
          cp app/build/outputs/bundle/release/app-release.aab SugarLock-play.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sugar Lock build ${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: |
            SugarLock.apk
            SugarLock-play.aab
